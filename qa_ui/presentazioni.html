<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>QA presentazioni</title>
<link rel="stylesheet" href="../web_frontend/html/css/modules.css">
<link rel="stylesheet" href="base.css">
</head>
<body class=view-module>
<header class="header" id="topBar"><div style="height:39px;display:flex;align-items:center"><strong>StudioIA_7 — QA presentazioni</strong></div></header>
<main id="main" class="view-page"></main>
<script src="env.js"></script>
<script src="../web_frontend/html/js/modules/fonti_panel.js"></script>
<script src="../web_frontend/html/js/modules/presentazioni.js"></script>
<script>
/* Harness R21 per presentazioni (clone del pattern documenti.html):
   seed + render via StudyTools.presentazioni + ready flag per il QA. */
(async function () {
    var QA = window.__QA, sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    try {
        QA.store.items.push({
            id: 'p1', kind: 'presentazione', title: 'Presentazione QA',
            content: JSON.stringify({ slides: [{ id: 's1', bg: '#f7f5ef', elements: [], transition: 'none', layout: '' }] }),
            materia: '', tags: '', description: '', thumbnail: '', folder_id: ''
        });
        /* fonti di testo per il pannello (adattatori R21) */
        QA.store.items.push({
            id: 'nf21', kind: 'note', title: 'Appunti Fonti PP',
            content: JSON.stringify({ objects: [{ t: 'text', x: 40, y: 40, w: 300, h: 30, text: 'Testo di prova appunti.', size: 14, color: '#141414' }] }),
            materia: '', tags: '', description: '', thumbnail: '', folder_id: ''
        });
        var main = document.getElementById('main');
        window.StudyTools.presentazioni.render(main, { open: 'p1' });
        var opened = await window.__qaUntil(function () {
            return !!document.querySelector('.pp-shell, .pp-pill-l, .pp-stage, #main > *');
        }, 10000);
        if (!opened) throw new Error('editor presentazioni non aperto');
        await sleep(400);
        window.__qaHarness21 = { ready: true, contesto: 'presentazioni' };
        QA.harnessReady = true;
        QA.done = false;
    } catch (e) {
        QA.errors.push('harness presentazioni: ' + (e && e.stack || e));
        QA.done = true;
    }
})();
</script>
</body>
</html>
